    ExchangeRate:
      type: object
      required: [currency, fcfaPerUnit, updatedAt]
      properties:
        currency:
          type: string
          enum: [EUR, USD, CNY]
        fcfaPerUnit:
          type: number
          description: Number of FCFA for 1 unit of the currency
