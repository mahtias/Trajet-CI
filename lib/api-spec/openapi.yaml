      properties:
        ticketCount:
          type: integer
        totalPaid:
          type: number
          description: Sum of what customers actually paid (tickets.price) = companyShare + platformCommission + seatSelectionFeePaid
        farePrice:
          type: number
        platformCommission:
          type: number
        companyShare:
          type: number
        seatSelectionFeePaid:
          type: number
        seatFeePlatformShare:
          type: number
        seatFeeCompanyShare:
          type: number

