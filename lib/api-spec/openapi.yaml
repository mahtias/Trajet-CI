    TripPricing:
      type: object
      required: [tripId, farePrice, platformCommission, seatSelectionFee, totalPrice]
      properties:
        tripId:
          type: integer
        farePrice:
          type: number
        platformCommission:
          type: number
          description: Service fee added on top of the fare, at the commission rate in force
        seatSelectionFee:
          type: number
        totalPrice:
          type: number
          description: farePrice + platformCommission, i.e. the amount due with an automatic seat (online or at the counter)

    CommissionSettings:
      type: object
      required: [commissionPercent, seatSelectionFee, seatSelectionPlatformPercent, updatedAt]
      properties:
        commissionPercent:
          type: number
        seatSelectionFee:
          type: number
        seatSelectionPlatformPercent:
          type: number
          description: Platform share of the seat selection fee; the company gets 100 minus this
        updatedAt:
          type: string
          format: date-time

