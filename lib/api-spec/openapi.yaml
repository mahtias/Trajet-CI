openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: UTB Bus Ticketing API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: trips
    description: Trip search and details
  - name: seats
    description: Seat reservation
  - name: payments
    description: Payment operations
  - name: tickets
    description: Ticket management
  - name: hotels
    description: Hotel search and booking
  - name: tourism
    description: Tourism spots and bookings
  - name: vehicles
    description: Vehicle rental and bookings
  - name: exchange-rates
    description: Display-only currency conversion rates
  - name: clerk
    description: Station clerk operations
  - name: admin
    description: Admin operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # Auth
  /auth/request-otp:
    post:
      operationId: requestOtp
      tags: [auth]
      summary: Request OTP for phone number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequest"
      responses:
        "200":
          description: OTP sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpResponse"
        "400":
          description: Invalid phone or e-mail, or e-mail required for a non-Ivorian number (code EMAIL_REQUIRED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpError"
        "403":
          description: >-
            The account has no e-mail and can't attach one at this step: staff account, or account with
            existing tickets or bookings (code IDENTITY_VERIFICATION_REQUIRED). An administrator must add it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpError"
        "409":
          description: E-mail already used by another account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpError"
        "429":
          description: Too many code requests (3 per number or 10 per IP address per hour)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpError"
        "503":
          description: The code could not be delivered by any channel (code DELIVERY_FAILED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpError"

  /auth/verify-otp:
    post:
      operationId: verifyOtp
      tags: [auth]
      summary: Verify OTP and create session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerify"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Wrong, expired or missing code
        "429":
          description: Too many wrong codes, a new one must be requested

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout current session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
    put:
      operationId: updateMe
      tags: [auth]
      summary: Update the logged-in user's own profile (e-mail only for now)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Invalid e-mail
        "401":
          description: Not logged in
        "409":
          description: E-mail already used by another account

  # Cities (public, for search forms)
  /cities:
    get:
      operationId: listCities
      tags: [trips]
      summary: List all cities
      responses:
        "200":
          description: Cities list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/City"

  # Trips
  /trips/search:
    get:
      operationId: searchTrips
      tags: [trips]
      summary: Search available trips
      parameters:
        - name: originCityId
          in: query
          required: true
          schema:
            type: integer
        - name: destinationCityId
          in: query
          required: true
          schema:
            type: integer
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: List of trips
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TripSummary"

  /trips/{tripId}:
    get:
      operationId: getTrip
      tags: [trips]
      summary: Get trip details
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Trip details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripDetail"

  /trips/{tripId}/pricing:
    get:
      operationId: getTripPricing
      tags: [trips]
      summary: Fare and seat selection fee for a trip (display only; the server recomputes everything at payment)
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Pricing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripPricing"
        "404":
          description: Trip not found

  /trips/{tripId}/seats:
    get:
      operationId: getTripSeats
      tags: [trips]
      summary: Get seat map for a trip
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Seat list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Seat"

  /trips/{tripId}/location:
    get:
      operationId: getTripLocation
      tags: [trips]
      summary: Last known bus position for a trip (staff of the trip's company, or a passenger with a paid ticket)
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Last known position
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripLocation"
        "401":
          description: Not logged in
        "403":
          description: No valid ticket for this trip
        "404":
          description: No position shared yet

  # Seat reservation
  # Payments
  /payments/initiate:
    post:
      operationId: initiatePayment
      tags: [payments]
      summary: Initiate mobile money payment (Wave, Orange Money, or MTN Money)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInput"
      responses:
        "200":
          description: Payment initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"

  /payments/paydunya-webhook:
    post:
      operationId: paydunyaWebhook
      tags: [payments]
      summary: PayDunya payment notification (IPN) for bus tickets and hotel bookings. Called by PayDunya, not by the app; the state is re-checked with PayDunya's confirm API.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/PaydunyaWebhookInput"
      responses:
        "200":
          description: Notification processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Malformed notification
        "404":
          description: Unknown invoice
        "502":
          description: PayDunya could not be reached to confirm (PayDunya retries)

  /payments/paydunya-refund-webhook:
    post:
      operationId: paydunyaRefundWebhook
      tags: [payments]
      summary: PayDunya API PUSH notification (final state of a refund). Called by PayDunya, not by the app; the state is re-checked with PayDunya's check-status API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaydunyaRefundWebhookInput"
      responses:
        "200":
          description: Notification processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Malformed notification
        "404":
          description: Unknown refund
        "502":
          description: PayDunya could not be reached to check the refund (PayDunya retries)

  # Tickets
  /tickets:
    get:
      operationId: getMyTickets
      tags: [tickets]
      summary: Get current user's tickets
      responses:
        "200":
          description: Ticket list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ticket"

  /tickets/{ticketId}:
    get:
      operationId: getTicket
      tags: [tickets]
      summary: Get one of the logged-in user's tickets
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ticket details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"
        "401":
          description: Not logged in
        "403":
          description: Belongs to another user
        "404":
          description: Not found

  /tickets/{ticketId}/payment-status:
    get:
      operationId: getTicketPaymentStatus
      tags: [tickets]
      summary: Current payment status of the logged-in user's ticket (polled after returning from PayDunya)
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Payment status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentStatusResponse"
        "401":
          description: Not logged in
        "403":
          description: Not your ticket
        "404":
          description: Ticket not found

  /tickets/{ticketId}/cancel:
    post:
      operationId: cancelTicket
      tags: [tickets]
      summary: Cancel a paid ticket (tiered refund based on time before departure)
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketCancellation"

  # Hotels
  /hotels/search:
    get:
      operationId: searchHotels
      tags: [hotels]
      summary: Search hotels by city and date range
      parameters:
        - name: city
          in: query
          required: true
          schema:
            type: string
        - name: checkIn
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: checkOut
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: rooms
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Hotels available for the given city and dates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HotelSearchResult"

  /hotels/{hotelId}:
    get:
      operationId: getHotel
      tags: [hotels]
      summary: Get hotel details
      parameters:
        - name: hotelId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Hotel details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hotel"

  /hotel-bookings/initiate:
    post:
      operationId: initiateHotelBooking
      tags: [hotels]
      summary: Start a hotel booking and create its PayDunya invoice (login required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HotelBookingInput"
      responses:
        "200":
          description: Booking initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HotelBookingInitiateResponse"

  /hotel-bookings:
    get:
      operationId: getMyHotelBookings
      tags: [hotels]
      summary: Get current user's hotel bookings
      responses:
        "200":
          description: Hotel booking list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HotelBooking"

  /hotel-bookings/{bookingId}:
    get:
      operationId: getHotelBooking
      tags: [hotels]
      summary: Get one of the logged-in user's hotel bookings
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Hotel booking details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HotelBooking"
        "401":
          description: Not logged in
        "403":
          description: Belongs to another user
        "404":
          description: Not found

  /hotel-bookings/{bookingId}/payment-status:
    get:
      operationId: getHotelBookingPaymentStatus
      tags: [hotels]
      summary: Current payment status of the logged-in user's hotel booking (polled after returning from PayDunya)
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Payment status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HotelBookingPaymentStatusResponse"
        "401":
          description: Not logged in
        "403":
          description: Belongs to another user
        "404":
          description: Not found

  # Admin - Hotels
  /admin/hotels:
    get:
      operationId: getAdminHotels
      tags: [admin]
      summary: List all hotels
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Hotels list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedHotels"
    post:
      operationId: createHotel
      tags: [admin]
      summary: Create a hotel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HotelInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hotel"

  /admin/hotels/{hotelId}:
    put:
      operationId: updateHotel
      tags: [admin]
      summary: Update a hotel
      parameters:
        - name: hotelId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HotelInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hotel"
    delete:
      operationId: deleteHotel
      tags: [admin]
      summary: Delete a hotel
      parameters:
        - name: hotelId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # Clerk
  /clerk/trips:
    get:
      operationId: getClerkTrips
      tags: [clerk]
      summary: Get today's trips for clerk selection
      responses:
        "200":
          description: Today's trips
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TripSummary"

  /clerk/trips/{tripId}/seats:
    get:
      operationId: getClerkTripSeats
      tags: [clerk]
      summary: Real-time seat map for clerk
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Seat list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Seat"

  /clerk/trips/{tripId}/passengers:
    get:
      operationId: getClerkPassengers
      tags: [clerk]
      summary: List of passengers for a trip
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Passenger list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Passenger"

  /clerk/tickets/{ticketId}/validate:
    post:
      operationId: validateTicket
      tags: [clerk]
      summary: Validate a ticket by QR code data
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketValidation"

  # Admin - Companies
  /admin/companies:
    get:
      operationId: getAdminCompanies
      tags: [admin]
      summary: List all companies
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
        - name: search
          in: query
          required: false
          description: Filter on the company name (case and accent insensitive)
          schema:
            type: string
      responses:
        "200":
          description: Companies list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedCompanies"
    post:
      operationId: createCompany
      tags: [admin]
      summary: Create a company
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"

  /admin/companies/{companyId}:
    put:
      operationId: updateCompany
      tags: [admin]
      summary: Update a company
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
    delete:
      operationId: deleteCompany
      tags: [admin]
      summary: Delete a company
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /admin/companies/{companyId}/payout-account:
    put:
      operationId: updateCompanyPayoutAccount
      tags: [admin]
      summary: Set the PayDunya account that automatically receives the company's share (super admin)
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyPayoutAccountInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyPayoutAccount"

  /admin/company-payouts:
    get:
      operationId: getCompanyPayoutStatus
      tags: [admin]
      summary: Paid tickets whose company share was not transferred automatically (failed, not configured, pending) — super admin
      parameters:
        - name: companyId
          in: query
          required: true
          schema:
            type: integer
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Untransferred amounts for this company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyPayoutStatusReport"

  /admin/refunds:
    get:
      operationId: getAdminRefunds
      tags: [admin]
      summary: Refunds not settled automatically (failed, to handle by hand, or not final yet) — super admin
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Refunds to follow up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRefundsReport"

  # Admin - Users
  /admin/users:
    get:
      operationId: getAdminUsers
      tags: [admin]
      summary: List all users
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Users list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedUsers"

  /admin/users/{userId}/role:
    put:
      operationId: updateUserRole
      tags: [admin]
      summary: Update a user's role
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRoleInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /admin/users/{userId}/email:
    put:
      operationId: updateUserEmail
      tags: [admin]
      summary: Set a user's e-mail by hand, once their identity was checked outside the app
      description: >-
        For accounts that can't attach an e-mail themselves at login (existing activity:
        IDENTITY_VERIFICATION_REQUIRED). The administrator does the identity check (phone call, ID card…) first.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid e-mail
        "403":
          description: Not an administrator
        "404":
          description: User not found
        "409":
          description: E-mail already used by another account


  # Admin - Cities
  /admin/cities:
    get:
      operationId: getAdminCities
      tags: [admin]
      summary: List all cities
      responses:
        "200":
          description: Cities list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/City"
    post:
      operationId: createCity
      tags: [admin]
      summary: Create a city
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CityInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/City"

  /admin/cities/{cityId}:
    delete:
      operationId: deleteCity
      tags: [admin]
      summary: Delete a city
      parameters:
        - name: cityId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # Admin - Stations
  /admin/stations:
    get:
      operationId: getAdminStations
      tags: [admin]
      summary: List all stations
      responses:
        "200":
          description: Stations list
          content:
            application/json:
              schema:
                type: array
