        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
    delete:
      operationId: deleteVehicle
      tags: [admin]
      summary: Delete a vehicle
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    SuccessResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean

    # Auth
    OtpRequest:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
        name:
          type: string
        email:
          type: ["string", "null"]
          maxLength: 254
          description: >-
            Used when the code can't go by SMS (non-Ivorian number) and the account has no e-mail yet:
            saved on the account, then the code is sent to it. Only for an account without any ticket or
            booking (otherwise IDENTITY_VERIFICATION_REQUIRED). Never replaces an existing e-mail.
            Ignored in every other case.

    OtpResponse:
      type: object
      required: [message, deliveryChannel, smsFailed]
      properties:
        message:
          type: string
        deliveryChannel:
          type: string
          enum: [sms, email]
          description: Channel the code was actually sent through
        smsFailed:
          type: boolean
          description: True when the SMS failed and the code went to the account's e-mail instead
        emailHint:
          type: ["string", "null"]
          description: Masked e-mail the code was sent to (e.g. je***@gmail.com), null for SMS
        devOtp:
          type: ["string", "null"]

    OtpError:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
          enum: [EMAIL_REQUIRED, DELIVERY_FAILED, IDENTITY_VERIFICATION_REQUIRED]
          description: Machine-readable reason, for the cases the login screen handles specially

    OtpVerify:
      type: object
      required: [phone, otp]
      properties:
        phone:
          type: string
        otp:
          type: string
        email:
          type: ["string", "null"]
          maxLength: 254
          description: Optional e-mail, saved on the account once the code is verified (empty = unchanged)

    ProfileInput:
      type: object
      required: [email]
      properties:
        email:
          type: ["string", "null"]
          maxLength: 254
          description: New e-mail; null or empty removes it

    AuthUser:
      type: object
      required: [id, phone, role]
      properties:
        id:
          type: integer
        phone:
          type: string
        name:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        role:
          type: string
          enum: [passenger, clerk, company_admin, admin]
        companyId:
          type: ["integer", "null"]
        companyName:
          type: ["string", "null"]
        agencyId:
          type: ["integer", "null"]
        agencyName:
          type: ["string", "null"]
        agencyType:
          type: ["string", "null"]
          enum: [hotel, tourism, vehicle_rental, null]

    # Company
    Company:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string
        createdAt:
          type: string
          format: date-time

    CompanyInput:
      type: object
      required: [name]
      properties:
        name:
          type: string

    CompanyPayoutAccountInput:
      type: object
      required: [paydunyaAccountAlias]
      properties:
        paydunyaAccountAlias:
          type: ["string", "null"]
          maxLength: 100
          description: Phone number or email of the company's PayDunya account; null or empty = no automatic transfer

    CompanyPayoutAccount:
      type: object
      required: [companyId, paydunyaAccountAlias]
      properties:
        companyId:
          type: integer
        paydunyaAccountAlias:
          type: ["string", "null"]

    CompanyPayoutItem:
      type: object
      required: [ticketId, passengerName, departureDate, amount, clawbackAmount, netAmount, status, error, attemptedAt]
      properties:
        ticketId:
          type: integer
        passengerName:
          type: string
        departureDate:
          type: string
        amount:
          type: number
          description: Amount owed to the company on this ticket (company share + its part of the seat fee)
        status:
          type: string
          enum: [not_configured, pending, failed, success]
          description: success rows are listed only when part of the transfer went to the company's clawback
        clawbackAmount:
          type: ["number", "null"]
          description: Taken off this transfer to settle the company's pending clawback
        netAmount:
          type: ["number", "null"]
          description: Actually sent to the company (amount - clawbackAmount)
        error:
          type: ["string", "null"]
        attemptedAt:
          type: ["string", "null"]
          format: date-time

    CompanyPayoutStatusReport:
      type: object
      required: [companyId, companyName, paydunyaAccountAlias, pendingClawback, items, totalAmount, total, page, pageSize]
      properties:
        companyId:
          type: integer
        companyName:
          type: string
        paydunyaAccountAlias:
          type: ["string", "null"]
        pendingClawback:
          type: number
          description: Owed back by the company (shares paid for tickets cancelled since), taken off its next transfers
        items:
          type: array
          items:
            $ref: "#/components/schemas/CompanyPayoutItem"
        totalAmount:
          type: number
          description: Sum owed over every untransferred ticket (all pages; clawback rows not included)
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    PaginatedCompanies:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Company"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    # User
    User:
      type: object
      required: [id, phone, role, createdAt]
      properties:
        id:
          type: integer
        phone:
          type: string
        name:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        role:
          type: string
          enum: [passenger, clerk, company_admin, admin]
        companyId:
          type: ["integer", "null"]
        companyName:
          type: ["string", "null"]
        agencyId:
          type: ["integer", "null"]
        agencyName:
          type: ["string", "null"]
        agencyType:
          type: ["string", "null"]
          enum: [hotel, tourism, vehicle_rental, null]
        createdAt:
          type: string
          format: date-time

    UserRoleInput:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [passenger, clerk, company_admin, admin]
        companyId:
          type: ["integer", "null"]
        agencyId:
          type: ["integer", "null"]

    PaginatedUsers:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    # City
    City:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string

    CityInput:
      type: object
      required: [name]
      properties:
        name:
          type: string

    # Station
    Station:
      type: object
      required: [id, name, cityId, cityName]
      properties:
        id:
          type: integer
        name:
          type: string
        cityId:
          type: integer
        cityName:
          type: string

    StationInput:
      type: object
      required: [name, cityId]
      properties:
        name:
          type: string
        cityId:
          type: integer

    # Company Station
    CompanyStationInput:
      type: object
      required: [stationId]
      properties:
        stationId:
          type: integer

    # Bus
    Bus:
      type: object
      required: [id, companyId, name, capacity, isActive]
      properties:
        id:
          type: integer
        companyId:
          type: integer
        name:
          type: string
        capacity:
          type: integer
        isActive:
          type: boolean

    BusInput:
      type: object
      required: [name, capacity]
      properties:
        name:
          type: string
        capacity:
          type: integer
        isActive:
          type: boolean

    # Route
    Route:
      type: object
      required: [id, originStationId, origin, destinationStationId, destination, durationMinutes, companyId, companyName]
      properties:
        id:
          type: integer
        originStationId:
          type: integer
        origin:
          type: string
        destinationStationId:
          type: integer
        destination:
          type: string
        durationMinutes:
          type: integer
        companyId:
          type: integer
        companyName:
          type: string

    RouteInput:
      type: object
      required: [originStationId, destinationStationId, durationMinutes, companyId]
      properties:
        originStationId:
          type: integer
        destinationStationId:
          type: integer
        durationMinutes:
          type: integer
        companyId:
          type: integer

    PaginatedRoutes:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Route"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    # Trip
    TripSummary:
      type: object
      required: [id, origin, destination, departureDate, departureTime, price, companyName, availableSeats, durationMinutes]
      properties:
        id:
          type: integer
        origin:
          type: string
        destination:
          type: string
        departureDate:
          type: string
        departureTime:
          type: string
        price:
          type: number
        companyName:
          type: string
        availableSeats:
          type: integer
        durationMinutes:
          type: integer

    TripDetail:
      type: object
      required: [id, origin, destination, departureDate, departureTime, price, companyName, companyId, routeId, durationMinutes, totalSeats, availableSeats, status]
      properties:
        id:
          type: integer
        origin:
          type: string
        destination:
          type: string
        departureDate:
          type: string
        departureTime:
          type: string
        price:
          type: number
        companyName:
          type: string
        companyId:
          type: integer
        routeId:
          type: integer
        durationMinutes:
          type: integer
        totalSeats:
          type: integer
        availableSeats:
          type: integer
        status:
          type: string
          enum: [active, cancelled]
        busId:
          type: integer
        busName:
          type: string

    PaginatedTrips:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TripDetail"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    TripInput:
      type: object
      required: [routeId, busId, departureDate, departureTime, price]
      properties:
        routeId:
          type: integer
        busId:
          type: integer
        departureDate:
          type: string
          format: date
        departureTime:
          type: string
        price:
          type: number

    TripUpdate:
      type: object
      properties:
        busId:
          type: integer
        departureDate:
          type: string
          format: date
        departureTime:
          type: string
        price:
          type: number
        status:
          type: string
          enum: [active, cancelled]

    # Seat
    Seat:
      type: object
      required: [id, tripId, seatNumber, status]
      properties:
        id:
          type: integer
        tripId:
          type: integer
        seatNumber:
          type: integer
        status:
          type: string
          enum: [available, reserved, sold]
        reservedAt:
          type: ["string", "null"]
        passengerName:
          type: ["string", "null"]

    # Payment
    PaymentInput:
      type: object
      required: [tripId, passengerName, passengerPhone, paymentMethod]
      properties:
        tripId:
          type: integer
        seatId:
          type: integer
          description: Chosen seat (manual selection, adds the seat selection fee). Omit for free automatic assignment.
        passengerName:
          type: string
        passengerPhone:
          type: string
        paymentMethod:
          type: string
          enum: [wave, orange_money, mtn_money, moov_money, card]

    PaymentResponse:
      type: object
      required: [paymentId, amount, status]
      properties:
        paymentId:
          type: string
        amount:
          type: number
        status:
          type: string
        redirectUrl:
          type: ["string", "null"]
          description: PayDunya checkout page to send the customer to
        ticketId:
          type: ["integer", "null"]
        farePrice:
          type: number
        platformCommission:
          type: number
          description: Service fee added on top of the fare (shown to passengers as "Frais de service")
        seatSelectionFeePaid:
          type: number
        seatNumber:
          type: integer

    PaydunyaWebhookInput:
      type: object
      description: Sent by PayDunya; "data" holds the invoice object (status, hash, invoice.token, invoice.total_amount, custom_data…)
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: true

    PaymentStatusResponse:
      type: object
      required: [ticketId, paymentStatus]
      properties:
        ticketId:
          type: integer
        paymentStatus:
          type: string
          enum: [pending, paid, failed, expired, refund_required]

    # Ticket
    Ticket:
      type: object
      required: [id, tripId, seatNumber, passengerName, passengerPhone, origin, destination, departureDate, departureTime, companyName, price, qrCode, paymentMethod, paymentStatus, createdAt]
      properties:
        id:
          type: integer
        tripId:
          type: integer
        seatNumber:
          type: integer
        passengerName:
          type: string
        passengerPhone:
          type: string
        origin:
          type: string
        destination:
          type: string
        departureDate:
          type: string
        departureTime:
          type: string
        companyName:
          type: string
        price:
          type: number
        farePrice:
          type: ["number", "null"]
          description: Base fare (null on tickets created before the price breakdown existed)
        serviceFee:
          type: ["number", "null"]
          description: >-
            Service fee the passenger paid on top of the fare (price - farePrice - seatSelectionFeePaid).
            0 on tickets sold when the commission was still deducted from the fare; null without a breakdown.
        seatSelectionFeePaid:
          type: ["number", "null"]
          description: Seat selection fee paid (0 = automatic seat)
        qrCode:
          type: string
        paymentMethod:
          type: string
          enum: [wave, orange_money, mtn_money, moov_money, card]
        paymentStatus:
          type: string
          enum: [pending, paid, failed, expired, refund_required]
        validated:
          type: boolean
        cancelledAt:
          type: ["string", "null"]
          format: date-time
        refundAmount:
          type: ["number", "null"]
        refundStatus:
          $ref: "#/components/schemas/RefundStatus"
        createdAt:
          type: string
          format: date-time

    TicketCancellation:
      type: object
      required: [success, refundAmount, feePercent, refundStatus]
      properties:
        success:
          type: boolean
          description: Always true when the ticket is cancelled, whatever the refund status
        refundAmount:
          type: number
        feePercent:
          type: number
        refundStatus:
          $ref: "#/components/schemas/RefundStatus"

    RefundStatus:
      type: string
      description: >-
        not_applicable (nothing to refund) | created (refund requested, not executed yet) | pending (operator processing)
        | success | failed (PayDunya refused or unreachable, handled by hand) | manual_required (card payment or
        non-Ivorian number, handled by hand)
      enum: [not_applicable, created, pending, success, failed, manual_required]

    PaydunyaRefundWebhookInput:
      type: object
      description: Sent by PayDunya (hash, status, token, withdraw_mode, amount, disburse_id, transaction_id, disburse_tx_id…)
      additionalProperties: true

    AdminRefundItem:
      type: object
      required: [ticketId, passengerName, accountPhone, paymentMethod, refundAmount, status, error, cancelledAt]
      properties:
        ticketId:
          type: integer
        passengerName:
          type: string
        accountPhone:
          type: ["string", "null"]
          description: Phone of the buyer's account (where an automatic refund is sent)
        paymentMethod:
          type: string
        refundAmount:
          type: number
        status:
          $ref: "#/components/schemas/RefundStatus"
        error:
          type: ["string", "null"]
        cancelledAt:
          type: ["string", "null"]
          format: date-time

    AdminRefundsReport:
      type: object
      required: [items, totalAmount, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminRefundItem"
        totalAmount:
          type: number
          description: Sum of the refund amounts over every page
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    # Hotel
    Hotel:
      type: object
      required: [id, agencyId, name, city, address, pricePerNight, totalRooms, createdAt]
      properties:
        id:
          type: integer
        agencyId:
          type: integer
        agencyName:
          type: string
        name:
          type: string
        city:
          type: string
        address:
          type: string
        description:
          type: ["string", "null"]
        pricePerNight:
          type: number
        totalRooms:
          type: integer
        rating:
          type: ["number", "null"]
        images:
          type: ["array", "null"]
          items:
            type: string
        createdAt:
          type: string
          format: date-time

    HotelInput:
      type: object
      required: [agencyId, name, city, address, pricePerNight, totalRooms]
      properties:
        agencyId:
          type: integer
        name:
          type: string
        city:
          type: string
        address:
          type: string
        description:
          type: ["string", "null"]
        pricePerNight:
          type: number
        totalRooms:
          type: integer
        rating:
          type: ["number", "null"]
        images:
          type: ["array", "null"]
          items:
            type: string

    PaginatedHotels:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Hotel"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    HotelSearchResult:
      type: object
      required: [id, name, city, address, pricePerNight, totalRooms, availableRooms]
      properties:
        id:
          type: integer
        name:
          type: string
        city:
          type: string
        address:
          type: string
        description:
          type: ["string", "null"]
        pricePerNight:
          type: number
        totalRooms:
          type: integer
        rating:
          type: ["number", "null"]
        images:
          type: ["array", "null"]
          items:
            type: string
        availableRooms:
          type: integer

    HotelBookingInput:
      type: object
      required: [hotelId, guestName, guestPhone, checkInDate, checkOutDate, rooms, paymentMethod]
      properties:
        hotelId:
          type: integer
        guestName:
          type: string
        guestPhone:
          type: string
        checkInDate:
          type: string
          format: date
        checkOutDate:
          type: string
          format: date
        rooms:
          type: integer
        paymentMethod:
          type: string
          enum: [wave, orange_money, mtn_money, moov_money, card]

    HotelBookingPaymentStatusResponse:
      type: object
      required: [bookingId, paymentStatus]
      properties:
        bookingId:
          type: integer
        paymentStatus:
          type: string
          enum: [pending, paid, failed, refund_required]

    HotelBookingInitiateResponse:
      type: object
      required: [paymentId, amount, status]
      properties:
        paymentId:
          type: string
        amount:
          type: number
        status:
          type: string
        bookingId:
          type: ["integer", "null"]
        redirectUrl:
          type: ["string", "null"]
          description: PayDunya checkout page to send the customer to

    HotelBooking:
      type: object
      required: [id, hotelId, hotelName, city, guestName, guestPhone, checkInDate, checkOutDate, rooms, totalPrice, qrCode, paymentMethod, paymentStatus, status, createdAt]
      properties:
        id:
          type: integer
        hotelId:
          type: integer
        hotelName:
          type: string
        city:
          type: string
        guestName:
          type: string
        guestPhone:
          type: string
        checkInDate:
          type: string
        checkOutDate:
          type: string
        rooms:
          type: integer
        totalPrice:
          type: number
        qrCode:
          type: string
        paymentMethod:
          type: string
          enum: [wave, orange_money, mtn_money, moov_money, card]
        paymentStatus:
          type: string
          enum: [pending, paid, failed, refund_required]
        status:
          type: string
          enum: [pending, confirmed, cancelled]
        createdAt:
          type: string
          format: date-time

    # Clerk
    Passenger:
      type: object
      required: [ticketId, passengerName, passengerPhone, seatNumber, paymentStatus, validated]
      properties:
        ticketId:
          type: integer
        passengerName:
          type: string
        passengerPhone:
          type: string
        seatNumber:
          type: integer
        paymentStatus:
          type: string
        validated:
          type: boolean

    TicketValidation:
      type: object
      required: [valid, ticket]
      properties:
        valid:
          type: boolean
        ticket:
          $ref: "#/components/schemas/Ticket"
        message:
          type: ["string", "null"]

    # Admin Dashboard
    DashboardStats:
      type: object
      required: [totalTicketsSoldToday, totalRevenuToday, totalTicketsSoldMonth, totalRevenueMonth, ticketsByCompany, salesByDay]
      properties:
        totalTicketsSoldToday:
          type: integer
        totalRevenuToday:
          type: number
        totalTicketsSoldMonth:
          type: integer
        totalRevenueMonth:
          type: number
        ticketsByCompany:
          type: array
          items:
            $ref: "#/components/schemas/CompanyStat"
        salesByDay:
          type: array
          items:
            $ref: "#/components/schemas/DailyStat"

    CompanyStat:
      type: object
      required: [companyName, ticketCount, revenue]
      properties:
        companyName:
          type: string
        ticketCount:
          type: integer
        revenue:
          type: number

    DailyStat:
      type: object
      required: [date, ticketCount, revenue]
      properties:
        date:
          type: string
        ticketCount:
          type: integer
        revenue:
          type: number

    SalesReport:
      type: object
      required: [from, to, totalTickets, totalRevenue, rows, total, page, pageSize]
      properties:
        from:
          type: string
        to:
          type: string
        totalTickets:
          type: integer
        totalRevenue:
          type: number
        rows:
          type: array
          items:
            $ref: "#/components/schemas/SalesReportRow"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    SalesReportRow:
      type: object
      required: [date, companyName, origin, destination, ticketCount, revenue]
      properties:
        date:
          type: string
        companyName:
          type: string
        origin:
          type: string
        destination:
          type: string
        ticketCount:
          type: integer
        revenue:
          type: number

    # Agencies, tourism, vehicle rental
    Agency:
      type: object
      required: [id, type, name, city, createdAt]
      properties:
        id:
          type: integer
        type:
          type: string
          enum:
            - hotel
            - tourism
            - vehicle_rental
        name:
          type: string
        city:
          type: string
        phone:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time

    AgencyInput:
      type: object
      required: [type, name, city]
      properties:
        type:
          type: string
          enum:
            - hotel
            - tourism
            - vehicle_rental
        name:
          type: string
        city:
          type: string
        phone:
          type:
            - string
            - "null"

    TourismSpot:
      type: object
      required: [id, agencyId, agencyName, name, location, price, capacityPerDay, isActive, createdAt]
      properties:
        id:
          type: integer
        agencyId:
          type: integer
